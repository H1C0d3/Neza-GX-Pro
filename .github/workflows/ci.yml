name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate main process syntax
        run: node --check main.js

      - name: Validate preload syntax
        run: node --check preload.js

      - name: Build Windows installer (no publish)
        run: npm run build:win -- --publish never
